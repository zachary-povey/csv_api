name: com.example.parquet_all_types
fields:
  - name: name
    logical_type:
      name: string
    representations:
      - pattern: "^(.*)$"
  - name: count
    logical_type:
      name: integer
    representations:
      - pattern: "^(-?[0-9]+)$"
  - name: amount
    logical_type:
      name: decimal
      args:
        precision: 10
        scale: 2
    representations:
      - pattern: "^(?P<value>-?[0-9]+\\.[0-9]{2})$"
  - name: ratio
    logical_type:
      name: decimal
      args:
        as_float: true
    representations:
      - pattern: "^(?P<value>-?[0-9]+\\.[0-9]+)$"
  - name: status
    logical_type:
      name: enum
      args:
        permitted_values: [active, inactive]
    representations:
      - pattern: "^(active|inactive)$"
  - name: day
    logical_type:
      name: date
    representations:
      - pattern: "^(?P<year>[0-9]{4})-(?P<month>[0-9]{2})-(?P<day>[0-9]{2})$"
  - name: at_time
    logical_type:
      name: time
    representations:
      - pattern: "^(?P<hour>[0-9]{2}):(?P<minute>[0-9]{2}):(?P<second>[0-9]{2})\\.(?P<microsecond>[0-9]{6})$"
  - name: ts
    logical_type:
      name: timestamp
    representations:
      - pattern: "^(?P<year>[0-9]{4})-(?P<month>[0-9]{2})-(?P<day>[0-9]{2})T(?P<hour>[0-9]{2}):(?P<minute>[0-9]{2}):(?P<second>[0-9]{2})(?P<timezone>[+-][0-9]{2}:[0-9]{2})$"
  - name: flag
    logical_type:
      name: boolean
    representations:
      - pattern: "^(true|false)$"
  - name: opt_name
    nullable: true
    logical_type:
      name: string
    representations:
      - pattern: "^-$"
        is_null: true
      - pattern: "^(.*)$"
  - name: opt_count
    nullable: true
    logical_type:
      name: integer
    representations:
      - pattern: "^-$"
        is_null: true
      - pattern: "^(-?[0-9]+)$"
  - name: opt_amount
    nullable: true
    logical_type:
      name: decimal
      args:
        precision: 10
        scale: 2
    representations:
      - pattern: "^-$"
        is_null: true
      - pattern: "^(?P<value>-?[0-9]+\\.[0-9]{2})$"
  - name: opt_ratio
    nullable: true
    logical_type:
      name: decimal
      args:
        as_float: true
    representations:
      - pattern: "^-$"
        is_null: true
      - pattern: "^(?P<value>-?[0-9]+\\.[0-9]+)$"
  - name: opt_status
    nullable: true
    logical_type:
      name: enum
      args:
        permitted_values: [active, inactive]
    representations:
      - pattern: "^-$"
        is_null: true
      - pattern: "^(active|inactive)$"
  - name: opt_day
    nullable: true
    logical_type:
      name: date
    representations:
      - pattern: "^-$"
        is_null: true
      - pattern: "^(?P<year>[0-9]{4})-(?P<month>[0-9]{2})-(?P<day>[0-9]{2})$"
  - name: opt_at_time
    nullable: true
    logical_type:
      name: time
    representations:
      - pattern: "^-$"
        is_null: true
      - pattern: "^(?P<hour>[0-9]{2}):(?P<minute>[0-9]{2}):(?P<second>[0-9]{2})\\.(?P<microsecond>[0-9]{6})$"
  - name: opt_ts
    nullable: true
    logical_type:
      name: timestamp
    representations:
      - pattern: "^-$"
        is_null: true
      - pattern: "^(?P<year>[0-9]{4})-(?P<month>[0-9]{2})-(?P<day>[0-9]{2})T(?P<hour>[0-9]{2}):(?P<minute>[0-9]{2}):(?P<second>[0-9]{2})(?P<timezone>[+-][0-9]{2}:[0-9]{2})$"
  - name: opt_flag
    nullable: true
    logical_type:
      name: boolean
    representations:
      - pattern: "^-$"
        is_null: true
      - pattern: "^(true|false)$"

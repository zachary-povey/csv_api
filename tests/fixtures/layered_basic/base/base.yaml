# the root config: defines the contract and the output schema
name: com.example.orders
fields:
  - name: id
    logical_type:
      name: integer
    representations:
      - pattern: "^[0-9]+$"
  - name: order_date
    logical_type:
      name: date
    representations:
      - pattern: "^(?P<year>[0-9]{4})-(?P<month>[0-9]{2})-(?P<day>[0-9]{2})$"
  - name: notes
    nullable: true
    required: false
    logical_type:
      name: string
    representations:
      - pattern: "^(.*)$"

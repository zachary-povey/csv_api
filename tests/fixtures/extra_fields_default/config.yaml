name: extra_fields_default
# allow_extra_fields not set: defaults to true
fields:
  - name: id
    logical_type:
      name: integer
    representations:
      - pattern: "^[0-9]+$"
  - name: first_name
    header_patterns:
      - "(?i)^first ?name$"
    logical_type:
      name: string
    representations:
      - pattern: "^(.+)$"

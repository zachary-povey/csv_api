name: missing_required_with_error_message
fields:
  - name: name
    logical_type:
      name: string
    representations:
      - pattern: "^(.*)$"
  - name: age
    error_message: "the age column must be included - contact the HR team"
    logical_type:
      name: integer
    representations:
      - pattern: "^([0-9]+)$"
  - name: team
    logical_type:
      name: string
    representations:
      - pattern: "^(.*)$"

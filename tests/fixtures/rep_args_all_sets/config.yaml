# TASK-9 AC#2: one representation per documented value arg set
fields:
  - name: s
    logical_type:
      name: string
    representations:
      - pattern: "^(.*)$"
  - name: i
    logical_type:
      name: integer
    representations:
      - pattern: "^(?P<value>[0-9]+)$"
      - pattern: "^none$"
        args:
          value: 0
  - name: e
    logical_type:
      name: enum
      args:
        permitted_values: [red, green]
    representations:
      - pattern: "^(red|green)$"
      - pattern: "^live$"
        args:
          value: red
  - name: d
    logical_type:
      name: date
    representations:
      - pattern: "^(?P<year>[0-9]{4})-(?P<month>[0-9]{2})-(?P<day>[0-9]{2})$"
      # a fixed pattern: the whole match is ignored by date
      - pattern: "^start$"
        args:
          year: 2020
          month: 1
          day: 1
      # is_null representations provide no value args and are not checked
      - pattern: "^$"
        is_null: true
  - name: dec_v
    logical_type:
      name: decimal
      args:
        precision: 10
        scale: 2
    representations:
      - pattern: "^(?P<value>[0-9]+\\.[0-9]{2})$"
  - name: dec_p
    logical_type:
      name: decimal
      args:
        precision: 10
        scale: 2
    representations:
      - pattern: "^\\$(?P<integer_part>[0-9]+)\\.(?P<decimal_part>[0-9]{2})$"
  - name: t
    logical_type:
      name: time
    representations:
      - pattern: "^(?P<hour>[0-9]{2}):(?P<minute>[0-9]{2})$"
      # every time arg is optional: no args is midnight
      - pattern: "^midnight$"
  - name: ts_epoch
    logical_type:
      name: timestamp
    representations:
      - pattern: "^(?P<value>[0-9]+)$"
        args:
          precision: seconds
          offset: 0
      - pattern: "^epoch$"
        args:
          value: 0
          precision: seconds
  - name: ts_comp
    logical_type:
      name: timestamp
    representations:
      - pattern: "^(?P<year>[0-9]{4})-(?P<month>[0-9]{2})-(?P<day>[0-9]{2}) (?P<hour>[0-9]{2}):(?P<minute>[0-9]{2}) (?P<timezone>[+-][0-9]{2}:[0-9]{2})$"

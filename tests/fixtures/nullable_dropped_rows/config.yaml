name: dropped
fields:
  - name: id
    logical_type:
      name: integer
    representations:
      - pattern: "^[0-9]+$"
  - name: amount
    nullable: true
    logical_type:
      name: decimal
      args:
        precision: 10
        scale: 2
    representations:
      - pattern: "^N/A$"
        is_null: true
      - pattern: "^([0-9]+\\.[0-9]{2})$"

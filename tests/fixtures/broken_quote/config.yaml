fields:
  - name: id
    logical_type:
      name: integer
    representations:
      - pattern: "^([0-9]+)$"
  - name: status
    logical_type:
      name: enum
      args:
        permitted_values: [active, inactive]
    representations:
      - pattern: "^(.*)$"
  - name: name
    logical_type:
      name: string
    representations:
      - pattern: "^(.*)$"

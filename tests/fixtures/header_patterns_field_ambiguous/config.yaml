name: header_patterns_field_ambiguous
fields:
  - name: id
    logical_type:
      name: integer
    representations:
      - pattern: "^[0-9]+$"
  - name: amount
    header_patterns:
      - "^Amount"
    logical_type:
      name: decimal
      args:
        as_float: true
    representations:
      - pattern: "^[0-9]+\\.[0-9]{2}$"

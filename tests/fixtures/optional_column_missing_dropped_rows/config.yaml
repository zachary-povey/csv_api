name: optional_columns
fields:
  - name: id
    logical_type:
      name: integer
    representations:
      - pattern: "^[0-9]+$"
  - name: note
    required: false
    nullable: true
    logical_type:
      name: string
    representations:
      - pattern: "^-$"
        is_null: true
      - pattern: "^(.+)$"
  - name: amount
    required: false
    nullable: true
    logical_type:
      name: decimal
      args:
        precision: 10
        scale: 2
    representations:
      - pattern: "^-$"
        is_null: true
      - pattern: "^[0-9]+\\.[0-9]{2}$"

name: chain
fields:
  - name: id
    error_message: from c
    logical_type:
      name: integer
    representations:
      - pattern: "^[0-9]+$"
  - name: day
    error_message: from c
    header_patterns:
      - "^Day \\(c\\)$"
    logical_type:
      name: date
    representations:
      - pattern: "^(?P<year>[0-9]{4})-(?P<month>[0-9]{2})-(?P<day>[0-9]{2})$"

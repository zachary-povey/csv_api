name: field_error_message
fields:
  - name: id
    logical_type:
      name: integer
    representations:
      - pattern: "^([0-9]+)$"
  - name: amount
    error_message: "amount must be pounds with 2 decimal places, e.g. 12.50 - contact the finance team"
    logical_type:
      name: decimal
      args:
        precision: 10
        scale: 2
    representations:
      - pattern: "^£?(?P<value>[0-9]+\\.[0-9]{2})$"
  - name: status
    header_patterns:
      - "^Status$"
    error_message: "status must be active or inactive"
    logical_type:
      name: enum
      args:
        permitted_values: [active, inactive]
    representations:
      - pattern: "^(.*)$"

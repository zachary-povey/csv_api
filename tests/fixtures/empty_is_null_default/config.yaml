name: empty_is_null_default
fields:
  - name: id
    logical_type:
      name: integer
    representations:
      - pattern: "^[0-9]+$"
  - name: label
    nullable: true
    logical_type:
      name: string
    representations:
      - pattern: "^(.+)$"
  - name: count
    nullable: true
    logical_type:
      name: integer
    representations:
      - pattern: "^[0-9]+$"
  - name: day
    nullable: true
    logical_type:
      name: date
    representations:
      - pattern: "^(?P<year>[0-9]{4})-(?P<month>[0-9]{2})-(?P<day>[0-9]{2})$"
  - name: active
    nullable: true
    logical_type:
      name: boolean
    representations:
      - pattern: "^(true|false)$"

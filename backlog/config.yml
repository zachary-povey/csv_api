project_name: "csv_api"
default_status: "To Do"
statuses: ["To Do", "In Progress", "Done"]
labels: []
date_format: yyyy-mm-dd
max_column_width: 20
auto_open_browser: false
default_port: 6420
remote_operations: true
auto_commit: false
filesystem_only: false
bypass_git_hooks: false
check_active_branches: true
active_branch_days: 30
task_prefix: "task"
definition_of_done: ["Full test suite passes (python3 -m pytest tests)", "go vet ./... is clean", "Every acceptance criterion has a test that names it (e.g. TASK-12 AC#2)", "README updated for any user-facing change"]
